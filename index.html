<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#16151e">
<meta name="description" content="La Piaule : discute avec tes potes dans des groupes et des salons. Gratuit.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Piaule">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="piaule-firebase.js"></script>
</head>
<body>
<title>La Piaule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : rail des groupes (72px) | liste | discussion. Pages plein écran (Profil, Paramètres, Panel, Quêtes) et feuilles qui montent du bas. 5 thèmes, "auto" suit le système. */
:root{
  --ink:#0f0e15; --rail:#0b0a10; --panel:#16151e; --raised:#211f2c; --raised2:#2b2938;
  --fg:#f1eff7; --muted:#9a96ad; --line:#2a2836;
  --accent:#ff6b5a; --accent-ink:#1a0d0b; --accent-2:#ffb347; --ok:#3ecf8e; --danger:#ff4d6a; --gold:#ffcf4a; --link:#6cb6ff;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --fs:15px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-skin]):not([data-theme="dark"]){
  --ink:#eceaf2; --rail:#e2dfea; --panel:#ffffff; --raised:#f3f1f7; --raised2:#e6e3ee; --fg:#1b1924; --muted:#615d72; --line:#e0dde8;
  --accent:#e2503f; --accent-ink:#ffffff; --accent-2:#d9861a; --link:#1f6fd1; color-scheme:light}}
:root[data-theme="light"]:not([data-skin]),:root[data-skin="clair"]{
  --ink:#eceaf2; --rail:#e2dfea; --panel:#ffffff; --raised:#f3f1f7; --raised2:#e6e3ee; --fg:#1b1924; --muted:#615d72; --line:#e0dde8;
  --accent:#e2503f; --accent-ink:#ffffff; --accent-2:#d9861a; --link:#1f6fd1; color-scheme:light}
:root[data-skin="braise"]{--ink:#0f0e15; --rail:#0b0a10; --panel:#16151e; --raised:#211f2c; --raised2:#2b2938; --fg:#f1eff7; --muted:#9a96ad; --line:#2a2836; --accent:#ff6b5a; --accent-ink:#1a0d0b; --accent-2:#ffb347; --link:#6cb6ff; color-scheme:dark}
:root[data-skin="nuit"]{--ink:#000; --rail:#000; --panel:#09090b; --raised:#151518; --raised2:#1f1f23; --fg:#f4f4f6; --muted:#8d8d96; --line:#1f1f24; --accent:#ff6b5a; --accent-ink:#140806; --accent-2:#ffb347; --link:#6cb6ff; color-scheme:dark}
:root[data-skin="lavande"]{--ink:#120f1d; --rail:#0d0a16; --panel:#1a1628; --raised:#251f38; --raised2:#2f2846; --fg:#f2eefc; --muted:#a59cc2; --line:#2e2742; --accent:#a57bff; --accent-ink:#120a25; --accent-2:#ff8ad8; --link:#8ec5ff; color-scheme:dark}
:root[data-skin="ocean"]{--ink:#07131a; --rail:#050e13; --panel:#0c1d26; --raised:#132a35; --raised2:#1a3542; --fg:#e9f6fb; --muted:#8fb0be; --line:#19323e; --accent:#3ec6d6; --accent-ink:#04161a; --accent-2:#7dffb2; --link:#7fd0ff; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:var(--fs);line-height:1.4;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block}
a{color:var(--link)}

.app{display:grid;grid-template-columns:72px 1fr;height:100%;min-height:0}
@media (min-width:900px){.app{grid-template-columns:72px 340px 1fr}}

/* Rail */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:12px;overflow-y:auto;padding-left:env(safe-area-inset-left,0px);scrollbar-width:none}
.rail-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--raised);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;position:relative;transition:border-radius .18s;color:#fff;padding:0}
.rail-btn > img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.rail-btn:hover,.rail-btn[aria-current="true"]{border-radius:16px}
.rail-btn[aria-current="true"]::before,.rail-btn.unread::before{content:"";position:absolute;left:-12px;top:50%;width:4px;border-radius:0 4px 4px 0;background:var(--fg);transition:height .18s,top .18s}
.rail-btn.unread::before{height:8px;top:20px}
.rail-btn[aria-current="true"]::before{height:36px;top:6px}
.rail-btn.home{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:16px}
.rail-btn.home svg{width:38px;height:38px}
.rail-btn.tool{background:var(--raised);color:var(--ok);font-size:22px}
.rail-btn.panel{background:linear-gradient(135deg,#ffcf4a,#ff6b5a);color:#1a0d0b;border-radius:16px}
.rail-btn .seal{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px}
.pip{position:absolute;right:-3px;bottom:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:3px solid var(--rail);box-sizing:content-box}
.rail-sep{width:32px;height:2px;border-radius:2px;background:var(--line);flex:none}

/* Liste */
.list{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:16px 0 0 0;padding-right:env(safe-area-inset-right,0px);overflow:hidden}
@media (min-width:900px){.list{padding-right:0;border-right:1px solid var(--line)}}
.list-head{padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px}
.list-head h1{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;min-width:0;background:none;border:0;padding:0;text-align:left;color:var(--fg)}
.list-head h1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv-banner{margin:-16px -14px 0;height:110px;background-size:cover;background-position:center;position:relative}
.srv-meta{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.srv-meta .on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px}
.actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--raised);display:grid;place-items:center;flex:none;font-size:17px}
.wide-btn{flex:1;min-width:0;height:42px;border-radius:21px;border:0;background:var(--raised);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;overflow:hidden}
.plus-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:24px;line-height:1;flex:none}
.search input{width:100%;box-sizing:border-box;height:40px;border-radius:20px;border:0;background:var(--raised);padding:0 16px}
.convs{flex:1;overflow-y:auto;min-height:0;padding:4px 8px 12px;display:flex;flex-direction:column;gap:2px}
.conv{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:14px;border:0;background:none;text-align:left;width:100%;color:var(--muted)}
.conv:hover,.conv[aria-current="true"]{background:var(--raised);color:var(--fg)}
.conv.unread{color:var(--fg)}
.conv .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center;color:var(--fg)}
.conv .prev{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.conv.unread .prev{color:var(--fg);font-weight:700}
.conv .when{color:var(--muted);font-size:12px;align-self:start;padding-top:3px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.conv .mid{min-width:0}
.cnt{min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.chan{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:0;background:none;width:100%;text-align:left;color:var(--muted);font-weight:500}
.chan:hover,.chan[aria-current="true"]{background:var(--raised);color:var(--fg)}
.chan.unread{color:var(--fg);font-weight:700}
.chan .hash{width:20px;text-align:center;font-family:var(--f-display);font-size:18px;opacity:.75;flex:none}
.chan .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .dotu{width:8px;height:8px;border-radius:50%;background:var(--fg)}
.cat{display:flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;padding:14px 6px 4px;width:100%;text-align:left}
.cat .chev{transition:transform .15s;font-size:10px}
.cat.closed .chev{transform:rotate(-90deg)}
.hashicon{width:44px;height:44px;border-radius:14px;background:var(--raised2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--muted)}
.section-label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);padding:12px 8px 4px}
.empty{color:var(--muted);text-align:center;padding:24px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:18px}
.empty svg.mascot{width:110px;height:110px}
.now-row{display:flex;gap:10px;overflow-x:auto;padding:4px 8px 8px;scrollbar-width:none;flex:none}
.now-card{flex:none;width:200px;background:var(--raised);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center;border:0;text-align:left}
.now-card .mid{min-width:0}
.now-card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-card span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Avatars & tags */
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;position:relative;flex:none;font-size:17px}
.av > img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av.sm{width:32px;height:32px;font-size:13px}
.av.xs{width:22px;height:22px;font-size:10px}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:3px solid var(--panel);box-sizing:border-box}
.tag{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:6px;background:var(--raised2);font-size:11px;font-weight:700;color:var(--fg);vertical-align:middle;white-space:nowrap}
.tag i{width:10px;height:10px;border-radius:3px;display:inline-block}
.gname{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent!important}

/* Barre profil */
.me-bar{margin:0 10px;margin-bottom:max(10px,env(safe-area-inset-bottom,0px));border-radius:20px;padding:10px 12px;display:flex;gap:12px;align-items:center;border:0;width:calc(100% - 20px);text-align:left;
  background:linear-gradient(100deg,var(--raised2),var(--raised) 55%,color-mix(in srgb,var(--me-banner,var(--accent)) 45%,var(--raised)))}
.me-bar .mid{min-width:0;flex:1}
.me-bar .name{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--me-banner,var(--accent));display:flex;gap:6px;align-items:center}
.me-bar .st{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.me-bar .gear{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--ink) 50%,transparent);display:grid;place-items:center;font-size:18px;flex:none}

/* Discussion */
.chat{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
@media (max-width:899px){.chat{position:fixed;inset:0;z-index:30;transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)} .app.chatting .chat{transform:none}}
@media (min-width:900px){.back{display:none!important}}
.chat-head{display:flex;align-items:center;gap:8px;padding-block:8px;border-bottom:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.chat-title{flex:1;min-width:0;border:0;background:none;text-align:left;display:flex;align-items:center;gap:8px;padding:4px}
.chat-title .t{min-width:0}
.chat-title b{font-family:var(--f-display);font-size:18px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-title small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-btn{width:38px;height:38px;border-radius:50%;border:0;background:none;font-size:17px;color:var(--muted);flex:none}
.hd-btn:hover{background:var(--raised);color:var(--fg)}
.back{background:none;border:0;font-size:28px;width:38px;height:38px;border-radius:10px;line-height:1;flex:none}
.feed{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;padding-block:12px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.day{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:700;margin:14px 6px 6px}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.newline{display:flex;align-items:center;gap:8px;color:var(--danger);font-size:11px;font-weight:800;margin:8px 6px}
.newline::before{content:"";flex:1;height:1px;background:var(--danger)}
.msg{display:grid;grid-template-columns:40px 1fr;column-gap:12px;padding:4px 8px;border-radius:12px;position:relative;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg:hover{background:color-mix(in srgb,var(--raised) 60%,transparent)}
.msg.mentioned{background:color-mix(in srgb,var(--gold) 12%,transparent);box-shadow:inset 3px 0 0 var(--gold)}
.msg.cont{padding-top:1px}
.msg.cont .av-btn{visibility:hidden;height:0}
.reply-to{grid-column:2;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0;margin-bottom:2px;position:relative;border:0;background:none;padding:0;text-align:left}
.reply-to::before{content:"";position:absolute;left:-32px;top:9px;width:26px;height:12px;border-left:2px solid var(--line);border-top:2px solid var(--line);border-radius:8px 0 0 0}
.reply-to b{color:var(--fg);white-space:nowrap}
.reply-to span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.av-btn{border:0;background:none;padding:0;border-radius:50%;height:40px;grid-row:span 2}
.msg .av{width:40px;height:40px;font-size:15px}
.msg .reply-to .av{width:18px;height:18px;font-size:9px}
.mbody{min-width:0}
.mhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.who{font-weight:700;border:0;background:none;padding:0}
.mini-badges{display:inline-flex;gap:2px;vertical-align:middle}
.mini-badges .bdg svg{width:16px;height:16px}
.time{font-size:11px;color:var(--muted)}
.text{white-space:pre-wrap;overflow-wrap:anywhere}
.text .edited{font-size:11px;color:var(--muted)}
.text h4{font-family:var(--f-display);font-size:22px;margin:6px 0 2px;line-height:1.15}
.text h5{font-family:var(--f-display);font-size:17px;margin:4px 0 2px}
.text blockquote{margin:2px 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}
.text code{background:var(--raised2);padding:1px 5px;border-radius:5px;font-size:.9em}
.mention{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);border-radius:4px;padding:0 3px;font-weight:700}
.mimg{max-width:min(100%,360px);max-height:420px;border-radius:14px;margin-top:6px;border:0;padding:0;background:none;display:block}
.mimg img{max-width:100%;max-height:420px;border-radius:14px;object-fit:cover}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.react{display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;background:var(--raised);border-radius:9px;padding:2px 8px;font-size:14px;font-weight:700}
.react.me{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--fg)}
.pinflag{font-size:11px;color:var(--gold);font-weight:700}
.hov{display:none;position:absolute;right:8px;top:-14px;background:var(--raised2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;z-index:2}
@media (hover:hover){.msg:hover .hov{display:flex}}
.hov button{border:0;background:none;border-radius:8px;padding:4px 7px;font-size:14px}
.hov button:hover{background:var(--raised)}
.typing{min-height:20px;font-size:12px;color:var(--muted);padding:0 16px;display:flex;align-items:center;gap:6px}
.typing i{display:inline-flex;gap:3px}
.typing i b{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i b:nth-child(2){animation-delay:.15s}.typing i b:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.replybar{display:flex;align-items:center;gap:8px;margin:0 12px;padding:8px 12px;background:var(--raised);border-radius:14px 14px 0 0;font-size:13px;color:var(--muted)}
.replybar b{color:var(--fg)}
.replybar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.replybar button{border:0;background:var(--raised2);border-radius:50%;width:24px;height:24px;font-size:12px}
.compose{display:flex;gap:8px;align-items:flex-end;padding-top:6px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.cbox{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--raised);border-radius:22px;padding-right:4px}
.cbox textarea{flex:1;min-width:0;resize:none;background:none;border:0;padding:11px 14px;max-height:140px;min-height:44px;box-sizing:border-box}
.cbox textarea:focus{outline:none}
.cbox button{border:0;background:none;width:38px;height:44px;font-size:19px;color:var(--muted)}
.round{height:44px;width:44px;border-radius:50%;border:0;background:var(--raised);font-size:22px;flex:none;color:var(--muted)}
.send{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px}
.notice{font-size:13px;color:var(--accent);padding:0 16px 6px}
.readonly-bar{padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));color:var(--muted);font-size:13px;text-align:center;border-top:1px solid var(--line)}

/* Annonces */
.annonce{display:grid;grid-template-columns:40px 1fr;column-gap:12px;padding:8px;border-radius:12px}
.annonce .text h4{font-size:24px}
.annonce .mimg{max-width:100%}

/* Feuilles */
.scrim{position:fixed;inset:0;background:#000a;z-index:60;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:92%;overflow-y:auto;background:var(--panel);border-radius:26px 26px 0 0;padding-bottom:max(20px,env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:600px){.sheet{left:50%;right:auto;width:480px;transform:translateX(-50%);bottom:auto;top:6%;border-radius:26px;animation:fade .2s}}

/* =================== Accueil d'un nouveau membre =================== */
function onboarding(){
  if(!S.me||P(S.me).joinedAt)return;
  const d={name:handleOf(S.me)||""};
  const head=el("div",{class:"badge-hero",html:mascot("hello")});head.querySelector("svg").style.cssText="width:140px;height:140px";
  head.append(el("b",{},"Bienvenue !"),el("span",{class:"hint"},"Je suis Piou. Choisis ton pseudo et c'est parti."));
  const form=el("form",{class:"sheet-body"},head,el("div",{class:"field"},el("label",{for:"oName"},"Ton pseudo"),el("input",{id:"oName",maxlength:"32",value:d.name})),
    el("button",{class:"btn",type:"submit"},"Entrer dans La Piaule"));
  form.onsubmit=async e=>{e.preventDefault();try{await saveProfile({name:$("oName").value.trim()||d.name,joinedAt:Date.now(),serveurs:[OFFICIAL]});closeSheet();S.view="serveur";S.serveur=OFFICIAL;renderAll();toast("Bienvenue dans La Piaule !");}catch(err){toast("Il te faut l'accès « contributeur » pour rejoindre.");}};
  openSheet(el("div",{class:"grab"}),form);
}

/* =================== Démarrage =================== */
function renderAll(){renderRail();renderList();renderMe();renderChatHead();updateComposer();
  if(PAGE&&PAGES[PAGE.kind]&&!$("page").hidden&&!$("page").contains(document.activeElement))renderPage();}
async function start(){
  const timer=setTimeout(()=>{$("convs").innerHTML='<div class="empty"><b>Hors ligne</b><span>La Piaule ne répond pas. Recharge la page.</span></div>';},10000);
  const [db,user,room,assets,downloads]=await Promise.all(["db","user","room","assets","downloads"].map(n=>claude.use(n)));
  Object.assign(S,{db,user,room,assets,downloads});
  if(!db){clearTimeout(timer);$("convs").innerHTML='<div class="empty"><b>Connecte-toi</b><span>Ouvre La Piaule avec ton compte Claude.</span></div>';return;}
  if(user){try{S.me=await user.id();S.isOwner=await user.isOwner();}catch(e){}await resolve([S.me]);}
  if(store.get("loggedOut")==="1")logout();
  if(room){try{if(store.get("loggedOut")!=="1")room.presence({here:true});
    room.onPeers(ch=>{S.online=new Set(ch.peers.filter(p=>p.presence&&p.presence.here).map(p=>p.by).filter(Boolean));renderRail();renderListBody();renderMe();});
    room.on("typing",m=>{if(m.isMe||!m.by||!m.data)return;S.typing[m.by]={key:m.data.key,until:Date.now()+4500};renderTyping();});}catch(e){}}
  const sub=(col,fn,q)=>(q||db.collection(col)).onSnapshot(fn,()=>{});
  sub("serveurs",s=>{clearTimeout(timer);S.serveurs=s.docs.map(d=>({id:d.id,...d.data()}));renderAll();},db.collection("serveurs").orderBy("createdAt","asc"));
  sub("salons",s=>{S.salons=s.docs.map(d=>({id:d.id,...d.data()}));resolve(S.salons.map(x=>x.lastAuthor)).then(()=>{renderRail();renderListBody();updateComposer();});});
  sub("profils",s=>{S.profils={};s.docs.forEach(d=>S.profils[d.id]=d.data());resolve(Object.keys(S.profils)).then(()=>{renderAll();if(S.open)renderFeed();});if(!S.profilsLoaded){S.profilsLoaded=true;onboarding();}});
  sub("badges",s=>{S.badges={};s.docs.forEach(d=>S.badges[d.id]={id:d.id,...d.data()});if(S.open)renderFeed();renderAll();});
  sub("attributions",s=>{S.attrib={};s.docs.forEach(d=>S.attrib[d.id]=d.data());if(S.open)renderFeed();renderAll();});
  sub("certifs",s=>{S.certifs={};s.docs.forEach(d=>S.certifs[d.id]=d.data());renderAll();});
  sub("annonces",s=>{S.annonces=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);if(S.open&&S.open.type==="annonces")renderFeed();},db.collection("annonces").orderBy("at","desc").limit(50));
  sub("versions",s=>{S.versions=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);renderList();},db.collection("versions").orderBy("at","desc").limit(30));
  if(S.isOwner)sub("signalements",s=>{S.reports=s.docs.flatMap(d=>(d.data().items||[]).map(it=>({...it,doc:d.id})));resolve(S.reports.flatMap(r=>[r.user,r.by])).then(()=>{renderRail();if(PAGE&&PAGE.section==="signalements"&&!$("page").hidden)renderPage();});});
  if(S.me){sub("dms",async s=>{S.dms=s.docs.map(d=>({id:d.id,...d.data()}));await resolve(S.dms.flatMap(d=>d.members));renderRail();renderListBody();},db.collection("dms").where("members","array-contains",S.me));
    db.doc("data/users/"+S.me+"/notes").get().then(d=>{if(d.exists)S.notes=d.data()||{};}).catch(()=>{});countMsgs(S.me);}
  renderAll();
}
